spring:
  application:
    name: drain-capacity-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ccdev}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    enabled: ${SEED_ENABLED:true}
  hydraulics:
    # 缺省扩大区间假设（会写入覆盖账本与证据，可复核）
    default-roughness-min: 0.009   # 糙率缺失时取下界（光滑衬砌）
    default-roughness-max: 0.035   # 糙率缺失时取上界（粗糙砌体/严重结垢）
    default-silt-max: 0.30         # 淤积率未知时假设的面积损失上界
    assumed-surcharge-m: 2.0       # 下游水位缺失时假设的出口壅水超高（米）
    alignment-tolerance-seconds: 600  # 校准样本时间对齐容差（流量/水位/降雨同一时刻判定）
  voi:
    # 复检信息价值估计参数（两路线共用，保证 evi 同口径可对照）
    interval-sigma-divisor: 4.0       # 风险区间 [min,max] 视为 ±2σ → σ=宽度/4
    conflict-inflation: 1.25          # 证据冲突时先验 σ 放大
    low-value-decision-prob: 0.05     # 决策变化概率低于该值标记低价值
    meas-base-risk-points: 3.0        # 测量不确定度基准（风险分，按方法分辨率/定位误差缩放）
    reference-resolution-m: 0.005     # 参考方法分辨率（CCTV ≈ 5mm）
    reference-location-error-m: 1.0
    sensitivity-local-window-std: 1.5 # 敏感度法局部窗口（倍数 σ）
    auto-enumeration-max-candidates: 12  # AUTO：≤12 候选走枚举法，否则敏感度法
    repaired-risk-score: 10.0         # “发现已修复”后验风险分基准
    weight:
      decision: 0.60                  # evi 合成：处置决定变化
      risk-length: 0.25               # evi 合成：剩余风险长度缩小
      network: 0.15                   # evi 合成：网络影响结论缩小

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

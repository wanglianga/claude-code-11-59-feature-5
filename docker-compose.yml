services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ccdev
      DB_USER: ccdev
      DB_PASSWORD: ccdev
      SEED_ENABLED: "true"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
